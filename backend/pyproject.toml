[project]
name = "poker-trainer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["phevaluator>=0.6,<0.7", "numpy>=2"]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "pokerkit>=0.7,<0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_trainer"]

[tool.pytest.ini_options]
markers = ["slow: long-running ground-truth tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
