[project]
name = "poker-trainer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "phevaluator>=0.6,<0.7",
    "numpy>=2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[project.scripts]
competence = "poker_trainer.analysis.competence:main"
openapi = "poker_trainer.api.app:dump_openapi"
puzzle-sample = "poker_trainer.puzzle.cli:main"
serve = "poker_trainer.api.app:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "pokerkit>=0.7,<0.8",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_trainer"]

[tool.pytest.ini_options]
markers = ["slow: long-running ground-truth tests"]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
